<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Orbit Prep</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f4ff; color: #211b3d; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
  .card { background: #fff; border-radius: 24px; padding: 2rem; text-align: center; max-width: 360px; box-shadow: 0 8px 32px rgba(101,87,217,.12); }
  .icon { font-size: 3.5rem; margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: .5rem; }
  p { font-size: .875rem; color: #64748b; line-height: 1.6; }
  .btn { display: inline-block; margin-top: 1.5rem; background: #6557d9; color: #fff; font-weight: 700; font-size: .875rem; padding: .75rem 1.5rem; border-radius: 999px; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📴</div>
  <h1>You're offline</h1>
  <p>No internet connection detected. Questions you've studied before may still be available — try going back.</p>
  <a href="/dashboard" class="btn">Go to Dashboard</a>
</div>
</body>
</html>
